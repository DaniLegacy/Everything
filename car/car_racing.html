<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Car Racing Game</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: white;
      font-family: sans-serif;
    }
    canvas {
      background: #444;
      border: 4px solid #fff;
      border-radius: 8px;
    }
    p {
      margin-top: 10px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>2D Car Racer</h1>
  <canvas id="gameCanvas" width="300" height="500"></canvas>
  <p>Use ⬅️ and ➡️ Arrow Keys to steer!</p>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Player car state
    const car = {
      x: 130,
      y: 400,
      width: 40,
      height: 70,
      speed: 5
    };

    // Controls
    let keys = {};
    window.addEventListener("keydown", (e) => keys[e.key] = true);
    window.addEventListener("keyup", (e) => keys[e.key] = false);

    // Obstacles & Game Loop Variables
    let obstacles = [];
    let score = 0;
    let gameOver = false;

    function spawnObstacle() {
      const lanes = [30, 130, 230];
      const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
      obstacles.push({ x: randomLane, y: -70, width: 40, height: 70, speed: 4 });
    }

    setInterval(() => {
      if (!gameOver) spawnObstacle();
    }, 1200);

    function update() {
      if (gameOver) return;

      // Move player car
      if (keys["ArrowLeft"] && car.x > 10) car.x -= car.speed;
      if (keys["ArrowRight"] && car.x < canvas.width - car.width - 10) car.x += car.speed;

      // Move obstacles
      for (let i = 0; i < obstacles.length; i++) {
        let obs = obstacles[i];
        obs.y += obs.speed;

        // Collision detection
        if (
          car.x < obs.x + obs.width &&
          car.x + car.width > obs.x &&
          car.y < obs.y + obs.height &&
          car.y + car.height > obs.y
        ) {
          gameOver = true;
          alert("Game Over! Score: " + score);
          document.location.reload();
        }
      }

      // Remove off-screen obstacles and increase score
      if (obstacles.length > 0 && obstacles[0].y > canvas.height) {
        obstacles.shift();
        score += 10;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Road Lines
      ctx.strokeStyle = "#fff";
      ctx.setLineDash([20, 20]);
      ctx.beginPath();
      ctx.moveTo(100, 0); ctx.lineTo(100, canvas.height);
      ctx.moveTo(200, 0); ctx.lineTo(200, canvas.height);
      ctx.stroke();

      // Draw Player Car (Blue)
      ctx.fillStyle = "#007bff";
      ctx.fillRect(car.x, car.y, car.width, car.height);

      // Draw Obstacles (Red)
      ctx.fillStyle = "#dc3545";
      obstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.width, obs.height));

      // Draw Score
      ctx.fillStyle = "#fff";
      ctx.font = "16px sans-serif";
      ctx.fillText("Score: " + score, 10, 25);
    }

    function gameLoop() {
      update();
      draw();
      if (!gameOver) requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
