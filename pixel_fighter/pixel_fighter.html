<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixel Shooter</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }
    #game-container {
      position: relative;
    }
    canvas {
      border: 4px solid #fff;
      background: #222;
      image-rendering: pixelated;
    }
    .hud {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .health-bar-container {
      width: 40%;
      height: 20px;
      border: 2px solid #fff;
      background: #444;
    }
    .health-bar {
      height: 100%;
      width: 100%;
      transition: width 0.1s linear;
    }
    #p1-health { background: #e74c3c; }
    #p2-health { background: #3498db; }

    /* Victory Banner Overlay */
    #victory-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
    }
    #victory-text {
      font-size: 48px;
      font-weight: bold;
      text-shadow: 4px 4px #000;
      letter-spacing: 2px;
    }
    
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    .active {
      display: flex;
    }
    
    .btn {
      background: #333;
      color: #fff;
      border: 2px solid #fff;
      padding: 10px 20px;
      font-family: monospace;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }
    .btn:hover { background: #555; }
    .btn:active { background: #fff; color: #000; }
    .btn-p1 { border-color: #e74c3c; }
    .btn-p2 { border-color: #3498db; }

    .map-buttons {
      display: flex;
      gap: 15px;
    }
    
    .controls-panel {
      display: flex;
      justify-content: space-between;
      width: 800px;
      margin-top: 15px;
    }
    .player-controls { display: flex; gap: 8px; }

    /* Customization Screen Grid */
    .editor-container {
      display: flex;
      gap: 30px;
      margin-top: 10px;
    }
    .editor-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(8, 20px);
      grid-template-rows: repeat(16, 20px);
      gap: 1px;
      background: #444;
      border: 2px solid #fff;
    }
    .pixel {
      width: 20px;
      height: 20px;
      background: #000000;
      cursor: pointer;
    }
    .palette {
      display: flex;
      gap: 5px;
    }
    .color-swatch {
      width: 20px;
      height: 20px;
      border: 1px solid #fff;
      cursor: pointer;
    }
    .rgb-picker-container {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      font-size: 12px;
    }
    .color-input {
      border: 1px solid #fff;
      background: none;
      width: 32px;
      height: 28px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="home-screen" class="screen active">
    <h1 style="font-size: 40px; margin-bottom: 20px;">PIXEL SHOOTER</h1>
    <button class="btn" id="start-btn">Gun Fight Mode</button>
    <button class="btn" id="slash-btn" style="border-color: #f1c40f; color: #f1c40f;">⚔️ Slash Mode (Swords Only)</button>
    <button class="btn" id="customize-btn">Customize Sprite</button>
  </div>

  <div id="map-screen" class="screen">
    <h2 style="font-size: 28px; margin-bottom: 15px;">SELECT MAP</h2>
    <div class="map-buttons">
      <button class="btn" id="map-egypt">Egypt</button>
      <button class="btn" id="map-australia">Australia</button>
      <button class="btn" id="map-africa">Africa</button>
    </div>
    <button class="btn" id="map-back-btn" style="margin-top: 15px;">Back</button>
  </div>

  <div id="game-screen" class="screen">
    <div id="game-container">
      <div class="hud">
        <div class="health-bar-container"><div id="p1-health" class="health-bar"></div></div>
        <div class="health-bar-container"><div id="p2-health" class="health-bar"></div></div>
      </div>
      <canvas id="canvas" width="800" height="400"></canvas>

      <div id="victory-overlay">
        <div id="victory-text">PLAYER 1 WINS!</div>
        <button class="btn" id="rematch-btn" style="border-color: #2ecc71; color: #2ecc71;">Play Again</button>
      </div>
    </div>

    <div class="controls-panel">
      <div class="player-controls">
        <button class="btn btn-p1" id="p1-left">◄ Left</button>
        <button class="btn btn-p1" id="p1-right">Right ►</button>
        <button class="btn btn-p1" id="p1-jump">▲ Jump</button>
        <button class="btn btn-p1" id="p1-attack">⚔️ Attack</button>
        <button class="btn btn-p1" id="p1-block">🛡 Block</button>
      </div>
      <div class="player-controls">
        <button class="btn btn-p2" id="p2-left">◄ Left</button>
        <button class="btn btn-p2" id="p2-right">Right ►</button>
        <button class="btn btn-p2" id="p2-jump">▲ Jump</button>
        <button class="btn btn-p2" id="p2-attack">⚔️ Attack</button>
        <button class="btn btn-p2" id="p2-block">🛡 Block</button>
      </div>
    </div>
    <div style="margin-top: 10px; font-size: 13px; color: #aaa;">
      <strong>P1:</strong> A/D (Move), W (Hold Jump), Space (Attack), S (Block) | 
      <strong>P2:</strong> ←/→ (Move), ↑ (Hold Jump), Shift (Attack), ↓ (Block)
    </div>
    <button class="btn" id="menu-btn" style="margin-top: 10px;">Main Menu</button>
  </div>

  <div id="custom-screen" class="screen">
    <h2>Sprite Editor (8x16)</h2>
    <div style="font-size: 12px; color: #ccc; margin-bottom: 5px;">Tip: Click and drag to color pixels faster!</div>
    <div class="editor-container">
      <div class="editor-box">
        <h3 style="color: #e74c3c;">Player 1</h3>
        <div id="p1-grid" class="grid"></div>
        <div class="palette" id="p1-palette"></div>
        <div class="rgb-picker-container">
          <label for="p1-rgb">Custom RGB:</label>
          <input type="color" id="p1-rgb" class="color-input" value="#ffffff">
        </div>
      </div>
      <div class="editor-box">
        <h3 style="color: #3498db;">Player 2</h3>
        <div id="p2-grid" class="grid"></div>
        <div class="palette" id="p2-palette"></div>
        <div class="rgb-picker-container">
          <label for="p2-rgb">Custom RGB:</label>
          <input type="color" id="p2-rgb" class="color-input" value="#ffffff">
        </div>
      </div>
    </div>
    <button class="btn" id="back-btn" style="margin-top: 15px;">Save & Back</button>
  </div>

  <script>
    // Audio Synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(80, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'slash') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(700, now);
        osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'death') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      } else if (type === 'block') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.setValueAtTime(600, now + 0.05);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'powerup') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    // Canvas Setup
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const gravity = 0.5;
    let animationId = null;
    let gameMode = 'guns'; 
    let isGameOver = false;

    // Maps Setup
    const maps = {
      Egypt: {
        bg: '#d4a359',
        ground: '#c28d38',
        platforms: [
          { x: 100, y: 280, width: 160, height: 16, color: '#e6c280' },
          { x: 320, y: 200, width: 160, height: 16, color: '#e6c280' },
          { x: 540, y: 280, width: 160, height: 16, color: '#e6c280' }
        ]
      },
      Australia: {
        bg: '#4a2e1b',
        ground: '#b34700',
        platforms: [
          { x: 80, y: 250, width: 180, height: 16, color: '#d96e2b' },
          { x: 540, y: 250, width: 180, height: 16, color: '#d96e2b' },
          { x: 260, y: 150, width: 280, height: 16, color: '#803300' }
        ]
      },
      Africa: {
        bg: '#2b3a1a',
        ground: '#4d3319',
        platforms: [
          { x: 150, y: 300, width: 140, height: 16, color: '#2d4d1e' },
          { x: 510, y: 300, width: 140, height: 16, color: '#2d4d1e' },
          { x: 50, y: 180, width: 140, height: 16, color: '#2d4d1e' },
          { x: 610, y: 180, width: 140, height: 16, color: '#2d4d1e' },
          { x: 330, y: 220, width: 140, height: 16, color: '#8b5a2b' }
        ]
      }
    };
    let currentMap = maps.Egypt;

    // Powerup Spawn System
    const POWERUP_TYPES = {
      SHIELD: { name: 'shield', color: '#00d2ff', glow: '#00ffff', label: '🛡️' },
      STRENGTH: { name: 'strength', color: '#ff2a2a', glow: '#ff5555', label: '🔥' },
      SPEED: { name: 'speed', color: '#00ff88', glow: '#77ffaa', label: '⚡' }
    };

    class PowerUp {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.width = 24;
        this.height = 24;
        this.floatOffset = Math.random() * Math.PI * 2;
        this.pulse = 0;
      }

      draw() {
        this.floatOffset += 0.06;
        this.pulse += 0.08;
        const currentY = this.y + Math.sin(this.floatOffset) * 5;
        const scale = 1 + Math.sin(this.pulse) * 0.1;

        ctx.save();
        ctx.translate(this.x + this.width / 2, currentY + this.height / 2);
        ctx.scale(scale, scale);

        ctx.shadowColor = this.type.glow;
        ctx.shadowBlur = 12;
        ctx.fillStyle = this.type.color;
        ctx.beginPath();
        ctx.arc(0, 0, 12, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = '12px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.type.label, 0, 1);

        ctx.restore();

        if (Math.random() < 0.3) {
          particles.push(new Particle({
            x: this.x + Math.random() * this.width,
            y: currentY + Math.random() * this.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: -Math.random() * 0.8,
            size: Math.random() * 2 + 1,
            color: this.type.color,
            life: 18
          }));
        }
      }

      update() {
        this.draw();
      }
    }

    let powerups = [];
    let powerupSpawnTimer = 0;

    function spawnPowerUp() {
      if (powerups.length >= 2 || isGameOver) return;
      const typeKeys = Object.keys(POWERUP_TYPES);
      const selectedType = POWERUP_TYPES[typeKeys[Math.floor(Math.random() * typeKeys.length)]];
      const platform = currentMap.platforms[Math.floor(Math.random() * currentMap.platforms.length)];
      
      const px = platform.x + Math.random() * (platform.width - 24);
      const py = platform.y - 32;

      powerups.push(new PowerUp(px, py, selectedType));
    }

    // Sprite Grids setup
    const defaultPalette = ['#000000', '#ffffff', '#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6'];
    let p1Sprite = Array(16).fill(null).map(() => Array(8).fill('#e74c3c'));
    let p2Sprite = Array(16).fill(null).map(() => Array(8).fill('#3498db'));
    let p1SelectedColor = '#ffffff';
    let p2SelectedColor = '#ffffff';

    // Global Mouse State for Drag-Coloring
    let isMouseDown = false;
    window.addEventListener('mousedown', () => isMouseDown = true);
    window.addEventListener('mouseup', () => isMouseDown = false);

    function createEditor(gridId, paletteId, pickerId, spriteData, getColor, setColor) {
      const grid = document.getElementById(gridId);
      const palette = document.getElementById(paletteId);
      const picker = document.getElementById(pickerId);
      grid.innerHTML = '';
      palette.innerHTML = '';

      const colorPixel = (r, c, pixelElem) => {
        spriteData[r][c] = getColor();
        pixelElem.style.background = getColor();
      };

      for (let r = 0; r < 16; r++) {
        for (let c = 0; c < 8; c++) {
          const pixel = document.createElement('div');
          pixel.className = 'pixel';
          pixel.style.background = spriteData[r][c];

          // Mouse Event Listeners for Instant Drag-to-Coloring
          pixel.addEventListener('mousedown', () => colorPixel(r, c, pixel));
          pixel.addEventListener('mouseenter', () => {
            if (isMouseDown) colorPixel(r, c, pixel);
          });

          // Touch Screen Support
          pixel.addEventListener('touchstart', (e) => {
            e.preventDefault();
            colorPixel(r, c, pixel);
          });

          grid.appendChild(pixel);
        }
      }

      // Touch drag handler across pixels grid
      grid.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        if (target && target.classList.contains('pixel')) {
          const pixels = Array.from(grid.children);
          const index = pixels.indexOf(target);
          if (index !== -1) {
            const r = Math.floor(index / 8);
            const c = index % 8;
            colorPixel(r, c, target);
          }
        }
      });

      defaultPalette.forEach(color => {
        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.background = color;
        swatch.addEventListener('click', () => {
          setColor(color);
          picker.value = color;
        });
        palette.appendChild(swatch);
      });

      picker.addEventListener('input', (e) => {
        setColor(e.target.value);
      });
    }

    // Particle class for disintegrating death & effects
    class Particle {
      constructor({ x, y, vx, vy, size, color, life, useGravity = false }) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.size = size;
        this.color = color;
        this.maxLife = life;
        this.life = life;
        this.useGravity = useGravity;
      }

      draw() {
        const alpha = this.life / this.maxLife;
        ctx.save();
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.restore();
      }

      update() {
        this.draw();
        this.x += this.vx;
        this.y += this.vy;
        if (this.useGravity) this.vy += 0.2;
        this.life--;
      }
    }

    class Bullet {
      constructor({ position, velocity, color, damage = 10 }) {
        this.position = position;
        this.velocity = velocity;
        this.width = 12;
        this.height = 4;
        this.color = color;
        this.damage = damage;
      }
      draw() {
        ctx.save();
        ctx.shadowColor = '#f39c12';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(this.position.x, this.position.y, this.width, this.height);
        ctx.fillStyle = this.color;
        ctx.fillRect(this.position.x + (this.velocity.x > 0 ? 0 : 4), this.position.y + 1, 8, 2);
        ctx.restore();
      }
      update() {
        this.draw();
        this.position.x += this.velocity.x;

        particles.push(new Particle({
          x: this.position.x + (this.velocity.x > 0 ? 0 : this.width),
          y: this.position.y + 2,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          size: Math.random() * 2 + 1,
          color: '#f39c12',
          life: 8
        }));
      }
    }

    // Fighter Class
    class Fighter {
      constructor({ position, color, facingRight, spriteData, name }) {
        this.name = name;
        this.position = position;
        this.velocity = { x: 0, y: 0 };
        this.width = 24;
        this.height = 48;
        this.color = color;
        this.health = 100;
        this.isGrounded = false;
        this.facingRight = facingRight;
        this.spriteData = spriteData;
        this.isBlocking = false;
        this.canBlock = true;
        this.isDead = false;

        this.moveSpeed = 4;

        this.powerups = {
          shieldTimer: 0,
          strengthTimer: 0,
          speedTimer: 0
        };

        this.isJumping = false;
        this.jumpTimer = 0;
        this.maxJumpHoldFrames = 15;

        this.isSlashing = false;
        this.slashFrame = 0;
        this.totalSlashFrames = 20;
        this.canSlash = true;
      }

      applyPowerUp(type) {
        playSound('powerup');
        if (type.name === 'shield') this.powerups.shieldTimer = 360; 
        if (type.name === 'strength') this.powerups.strengthTimer = 360;
        if (type.name === 'speed') this.powerups.speedTimer = 360;

        for (let i = 0; i < 15; i++) {
          particles.push(new Particle({
            x: this.position.x + this.width / 2,
            y: this.position.y + this.height / 2,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            size: Math.random() * 4 + 2,
            color: type.color,
            life: 25
          }));
        }
      }

      drawPowerupAuras() {
        const cx = this.position.x + this.width / 2;
        const cy = this.position.y + this.height / 2;

        if (this.powerups.shieldTimer > 0) {
          ctx.save();
          ctx.strokeStyle = '#00d2ff';
          ctx.fillStyle = 'rgba(0, 210, 255, 0.15)';
          ctx.shadowColor = '#00ffff';
          ctx.shadowBlur = 15;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(cx, cy, 32, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          const angle = Date.now() * 0.003;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(cx, cy, 30, angle, angle + Math.PI * 0.8);
          ctx.stroke();
          ctx.restore();
        }

        if (this.powerups.strengthTimer > 0) {
          ctx.save();
          const flameTime = Date.now() * 0.01;
          for (let i = 0; i < 5; i++) {
            const offsetX = Math.sin(flameTime + i) * 12;
            const offsetY = (i * 8 + (Date.now() * 0.05) % 40);
            ctx.fillStyle = i % 2 === 0 ? '#ff2a2a' : '#ff9900';
            ctx.globalAlpha = 0.4;
            ctx.beginPath();
            ctx.arc(cx + offsetX, this.position.y + this.height - (offsetY % 50), 6 + (i % 3), 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        if (this.powerups.speedTimer > 0 && (this.velocity.x !== 0 || this.velocity.y !== 0)) {
          if (Math.random() < 0.6) {
            particles.push(new Particle({
              x: this.position.x + (Math.random() * this.width),
              y: this.position.y + (Math.random() * this.height),
              vx: -this.velocity.x * 0.3,
              vy: -this.velocity.y * 0.3,
              size: 4,
              color: '#00ff88',
              life: 12
            }));
          }
        }
      }

      draw() {
        if (this.isDead) return;

        this.drawPowerupAuras();

        const pixelSize = 3;
        let offsetX = 0;
        let offsetY = 0;
        let swordAngle = 0;
        let renderSlashWave = false;

        if (this.isSlashing) {
          const progress = this.slashFrame / this.totalSlashFrames;
          const dir = this.facingRight ? 1 : -1;

          if (progress < 0.15) { 
            offsetX = -3 * dir;
            offsetY = -2;
            swordAngle = -Math.PI * 0.45 * dir;
          } else if (progress < 0.35) { 
            offsetX = 8 * dir;
            offsetY = 3;
            swordAngle = Math.PI * 0.4 * dir;
            renderSlashWave = true;
          } else if (progress < 0.65) { 
            offsetX = 10 * dir;
            offsetY = 5;
            swordAngle = Math.PI * 0.6 * dir;
          } else if (progress < 0.85) { 
            offsetX = 2 * dir;
            offsetY = -1;
            swordAngle = Math.PI * 0.1 * dir;
          } else { 
            offsetX = 0;
            offsetY = 0;
            swordAngle = 0;
          }
        }

        for (let r = 0; r < 16; r++) {
          for (let c = 0; c < 8; c++) {
            const pixelColor = this.spriteData[r][c];
            if (pixelColor !== '#000000') {
              ctx.fillStyle = pixelColor;
              ctx.fillRect(
                this.position.x + offsetX + c * pixelSize,
                this.position.y + offsetY + r * pixelSize,
                pixelSize,
                pixelSize
              );
            }
          }
        }

        if (gameMode === 'slash') {
          const originX = (this.facingRight ? this.position.x + this.width : this.position.x) + offsetX;
          const originY = this.position.y + 24 + offsetY;

          ctx.save();
          ctx.translate(originX, originY);
          
          const baseDirection = this.facingRight ? 1 : -1;
          ctx.rotate(swordAngle);

          ctx.fillStyle = this.powerups.strengthTimer > 0 ? '#ff2a2a' : '#bdc3c7';
          ctx.fillRect(0, -3 * baseDirection, 36 * baseDirection, 5);
          ctx.fillStyle = '#f1c40f';
          ctx.fillRect(0, -6 * baseDirection, 4 * baseDirection, 11);
          ctx.restore();

          if (renderSlashWave) {
            ctx.save();
            ctx.translate(originX, originY);
            ctx.strokeStyle = this.powerups.strengthTimer > 0 ? '#ff2a2a' : '#ffffff';
            ctx.shadowColor = this.powerups.strengthTimer > 0 ? '#ff0000' : '#3498db';
            ctx.shadowBlur = 15;
            ctx.lineWidth = this.powerups.strengthTimer > 0 ? 9 : 6;
            ctx.beginPath();
            const startAngle = this.facingRight ? -Math.PI * 0.4 : Math.PI * 0.6;
            const endAngle = this.facingRight ? Math.PI * 0.45 : Math.PI * 1.4;
            ctx.arc(0, 0, 48, startAngle, endAngle, !this.facingRight);
            ctx.stroke();

            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, 42, startAngle, endAngle, !this.facingRight);
            ctx.stroke();
            ctx.restore();
          }
        }

        if (this.isBlocking) {
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(
            this.position.x + this.width / 2,
            this.position.y + this.height / 2,
            28, 0, Math.PI * 2
          );
          ctx.stroke();
        }
      }

      update(platforms, isHoldingJump) {
        if (this.isDead) return;

        if (this.powerups.shieldTimer > 0) this.powerups.shieldTimer--;
        if (this.powerups.strengthTimer > 0) this.powerups.strengthTimer--;
        if (this.powerups.speedTimer > 0) this.powerups.speedTimer--;

        this.moveSpeed = this.powerups.speedTimer > 0 ? 7 : 4;

        if (this.isSlashing) {
          this.slashFrame++;
          if (this.slashFrame >= this.totalSlashFrames) {
            this.isSlashing = false;
            this.slashFrame = 0;
          }
        }

        this.draw();
        
        if (isHoldingJump && this.isJumping) {
          if (this.jumpTimer < this.maxJumpHoldFrames) {
            this.velocity.y = this.powerups.speedTimer > 0 ? -9.5 : -8;
            this.jumpTimer++;
          }
        } else {
          this.isJumping = false;
        }

        this.position.x += this.velocity.x;
        if (this.position.x < 0) this.position.x = 0;
        if (this.position.x + this.width > canvas.width) this.position.x = canvas.width - this.width;

        this.position.y += this.velocity.y;
        this.velocity.y += gravity;

        this.isGrounded = false;

        const groundY = canvas.height - 20;
        if (this.position.y + this.height >= groundY) {
          this.position.y = groundY - this.height;
          this.velocity.y = 0;
          this.isGrounded = true;
          this.isJumping = false;
        }

        platforms.forEach(plat => {
          if (
            this.position.x + this.width > plat.x &&
            this.position.x < plat.x + plat.width &&
            this.position.y + this.height >= plat.y &&
            this.position.y + this.height - this.velocity.y <= plat.y
          ) {
            this.position.y = plat.y - this.height;
            this.velocity.y = 0;
            this.isGrounded = true;
            this.isJumping = false;
          }
        });
      }

      takeDamage(amount) {
        if (this.powerups.shieldTimer > 0) {
          playSound('block');
          for (let i = 0; i < 8; i++) {
            particles.push(new Particle({
              x: this.position.x + this.width / 2,
              y: this.position.y + this.height / 2,
              vx: (Math.random() - 0.5) * 5,
              vy: (Math.random() - 0.5) * 5,
              size: Math.random() * 3 + 2,
              color: '#00ffff',
              life: 12
            }));
          }
          return false;
        }

        playSound('hit');
        this.health = Math.max(0, this.health - amount);
        const healthBarId = this === player1 ? 'p1-health' : 'p2-health';
        document.getElementById(healthBarId).style.width = this.health + '%';

        if (this.health <= 0) {
          this.die();
          triggerGameOver(this === player1 ? 'PLAYER 2' : 'PLAYER 1');
          return true;
        }
        return false;
      }

      startJump() {
        if (this.isGrounded && !this.isDead) {
          this.velocity.y = this.powerups.speedTimer > 0 ? -9.5 : -8;
          this.isGrounded = false;
          this.isJumping = true;
          this.jumpTimer = 0;
        }
      }

      block() {
        if (this.canBlock && !this.isBlocking && !this.isDead) {
          this.isBlocking = true;
          this.canBlock = false;
          playSound('block');
          
          setTimeout(() => {
            this.isBlocking = false;
          }, 500);

          setTimeout(() => {
            this.canBlock = true;
          }, 1000);
        }
      }

      die() {
        if (this.isDead) return;
        this.isDead = true;
        playSound('death');

        const pixelSize = 3;
        for (let r = 0; r < 16; r++) {
          for (let c = 0; c < 8; c++) {
            const pixelColor = this.spriteData[r][c];
            if (pixelColor !== '#000000') {
              particles.push(new Particle({
                x: this.position.x + c * pixelSize,
                y: this.position.y + r * pixelSize,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 1) * 6,
                size: pixelSize,
                color: pixelColor,
                life: 60 + Math.random() * 30,
                useGravity: true
              }));
            }
          }
        }
      }

      attack(bullets, opponent) {
        if (this.isDead || isGameOver) return;

        const baseDamage = this.powerups.strengthTimer > 0 ? 25 : 10;

        if (gameMode === 'guns') {
          playSound('shoot');
          const direction = this.facingRight ? 12 : -12;
          const bulletPosX = this.facingRight ? this.position.x + this.width : this.position.x - 8;
          bullets.push(new Bullet({
            position: { x: bulletPosX, y: this.position.y + 18 },
            velocity: { x: direction, y: 0 },
            color: this.powerups.strengthTimer > 0 ? '#ff2a2a' : '#f1c40f',
            damage: baseDamage
          }));

          for (let i = 0; i < 6; i++) {
            particles.push(new Particle({
              x: bulletPosX,
              y: this.position.y + 20,
              vx: (this.facingRight ? 1 : -1) * (Math.random() * 4 + 1),
              vy: (Math.random() - 0.5) * 3,
              size: Math.random() * 3 + 2,
              color: '#e67e22',
              life: 10
            }));
          }
        } else if (gameMode === 'slash') {
          if (!this.canSlash) return;
          this.isSlashing = true;
          this.slashFrame = 0;
          this.canSlash = false;
          playSound('slash');

          setTimeout(() => { this.canSlash = true; }, 350);

          setTimeout(() => {
            if (this.isDead || opponent.isDead) return;

            const slashRange = 60;
            const slashX = this.facingRight ? this.position.x + this.width : this.position.x - slashRange;
            
            if (
              slashX < opponent.position.x + opponent.width &&
              slashX + slashRange > opponent.position.x &&
              this.position.y < opponent.position.y + opponent.height &&
              this.position.y + this.height > opponent.position.y
            ) {
              if (opponent.isBlocking) {
                playSound('block');
              } else {
                const slashDmg = this.powerups.strengthTimer > 0 ? 35 : 20;
                const fatal = opponent.takeDamage(slashDmg);

                if (!fatal) {
                  for (let i = 0; i < 12; i++) {
                    particles.push(new Particle({
                      x: opponent.position.x + opponent.width / 2,
                      y: opponent.position.y + opponent.height / 2,
                      vx: (Math.random() - 0.5) * 8,
                      vy: (Math.random() - 0.5) * 8,
                      size: Math.random() * 3 + 2,
                      color: this.powerups.strengthTimer > 0 ? '#ff2a2a' : '#ffffff',
                      life: 14
                    }));
                  }
                }
              }
            }
          }, 100);
        }
      }
    }

    let player1, player2, bullets = [], particles = [];
    const keys = { 
      p1Left: false, p1Right: false, p1Jump: false,
      p2Left: false, p2Right: false, p2Jump: false 
    };

    function initGame() {
      isGameOver = false;
      document.getElementById('victory-overlay').style.display = 'none';

      player1 = new Fighter({
        name: 'PLAYER 1',
        position: { x: 100, y: 100 },
        color: '#e74c3c',
        facingRight: true,
        spriteData: p1Sprite
      });
      player2 = new Fighter({
        name: 'PLAYER 2',
        position: { x: 660, y: 100 },
        color: '#3498db',
        facingRight: false,
        spriteData: p2Sprite
      });
      player1.health = 100;
      player2.health = 100;
      document.getElementById('p1-health').style.width = '100%';
      document.getElementById('p2-health').style.width = '100%';
      bullets = [];
      particles = [];
      powerups = [];
      powerupSpawnTimer = 0;
    }

    function triggerGameOver(winnerName) {
      isGameOver = true;
      setTimeout(() => {
        const overlay = document.getElementById('victory-overlay');
        const text = document.getElementById('victory-text');
        text.innerText = `${winnerName} WINS!`;
        text.style.color = winnerName === 'PLAYER 1' ? '#e74c3c' : '#3498db';
        overlay.style.display = 'flex';
      }, 1000);
    }

    function drawMap() {
      ctx.fillStyle = currentMap.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = currentMap.ground;
      ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

      currentMap.platforms.forEach(plat => {
        ctx.fillStyle = plat.color;
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
      });
    }

    function animate() {
      animationId = requestAnimationFrame(animate);

      drawMap();

      if (!isGameOver) {
        player1.velocity.x = 0;
        player2.velocity.x = 0;

        if (keys.p1Left) { player1.velocity.x = -player1.moveSpeed; player1.facingRight = false; }
        if (keys.p1Right) { player1.velocity.x = player1.moveSpeed; player1.facingRight = true; }
        if (keys.p2Left) { player2.velocity.x = -player2.moveSpeed; player2.facingRight = false; }
        if (keys.p2Right) { player2.velocity.x = player2.moveSpeed; player2.facingRight = true; }

        powerupSpawnTimer++;
        if (powerupSpawnTimer % 350 === 0) {
          spawnPowerUp();
        }
      }

      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.update();

        if (
          !player1.isDead &&
          player1.position.x < p.x + p.width &&
          player1.position.x + player1.width > p.x &&
          player1.position.y < p.y + p.height &&
          player1.position.y + player1.height > p.y
        ) {
          player1.applyPowerUp(p.type);
          powerups.splice(i, 1);
          continue;
        }

        if (
          !player2.isDead &&
          player2.position.x < p.x + p.width &&
          player2.position.x + player2.width > p.x &&
          player2.position.y < p.y + p.height &&
          player2.position.y + player2.height > p.y
        ) {
          player2.applyPowerUp(p.type);
          powerups.splice(i, 1);
          continue;
        }
      }

      player1.update(currentMap.platforms, keys.p1Jump);
      player2.update(currentMap.platforms, keys.p2Jump);

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      if (gameMode === 'guns' && !isGameOver) {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.update();

          if (b.position.x < 0 || b.position.x > canvas.width) {
            bullets.splice(i, 1);
            continue;
          }

          if (
            !player2.isDead &&
            b.position.x < player2.position.x + player2.width &&
            b.position.x + b.width > player2.position.x &&
            b.position.y < player2.position.y + player2.height &&
            b.position.y + b.height > player2.position.y
          ) {
            if (player2.isBlocking) {
              playSound('block');
            } else {
              player2.takeDamage(b.damage);
            }
            bullets.splice(i, 1);
            continue;
          }

          if (
            !player1.isDead &&
            b.position.x < player1.position.x + player1.width &&
            b.position.x + b.width > player1.position.x &&
            b.position.y < player1.position.y + player1.height &&
            b.position.y + b.height > player1.position.y
          ) {
            if (player1.isBlocking) {
              playSound('block');
            } else {
              player1.takeDamage(b.damage);
            }
            bullets.splice(i, 1);
            continue;
          }
        }
      }
    }

    // Controls Setup
    function setupButton(buttonId, onPress, onRelease) {
      const btn = document.getElementById(buttonId);
      btn.addEventListener('mousedown', onPress);
      btn.addEventListener('mouseup', onRelease);
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); onPress(); });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); onRelease(); });
    }

    setupButton('p1-left', () => keys.p1Left = true, () => keys.p1Left = false);
    setupButton('p1-right', () => keys.p1Right = true, () => keys.p1Right = false);
    setupButton('p1-jump', () => { keys.p1Jump = true; player1.startJump(); }, () => keys.p1Jump = false);
    setupButton('p1-attack', () => player1.attack(bullets, player2), () => {});
    setupButton('p1-block', () => player1.block(), () => {});

    setupButton('p2-left', () => keys.p2Left = true, () => keys.p2Left = false);
    setupButton('p2-right', () => keys.p2Right = true, () => keys.p2Right = false);
    setupButton('p2-jump', () => { keys.p2Jump = true; player2.startJump(); }, () => keys.p2Jump = false);
    setupButton('p2-attack', () => player2.attack(bullets, player1), () => {});
    setupButton('p2-block', () => player2.block(), () => {});

    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyA') keys.p1Left = true;
      if (e.code === 'KeyD') keys.p1Right = true;
      if (e.code === 'KeyW' && !keys.p1Jump) { keys.p1Jump = true; player1.startJump(); }
      if (e.code === 'Space') player1.attack(bullets, player2);
      if (e.code === 'KeyS') player1.block();

      if (e.code === 'ArrowLeft') keys.p2Left = true;
      if (e.code === 'ArrowRight') keys.p2Right = true;
      if (e.code === 'ArrowUp' && !keys.p2Jump) { keys.p2Jump = true; player2.startJump(); }
      if (e.key === 'Shift') player2.attack(bullets, player1);
      if (e.code === 'ArrowDown') player2.block();
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyA') keys.p1Left = false;
      if (e.code === 'KeyD') keys.p1Right = false;
      if (e.code === 'KeyW') keys.p1Jump = false;

      if (e.code === 'ArrowLeft') keys.p2Left = false;
      if (e.code === 'ArrowRight') keys.p2Right = false;
      if (e.code === 'ArrowUp') keys.p2Jump = false;
    });

    // Navigation Screens
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    document.getElementById('start-btn').addEventListener('click', () => {
      gameMode = 'guns';
      showScreen('map-screen');
    });

    document.getElementById('slash-btn').addEventListener('click', () => {
      gameMode = 'slash';
      showScreen('map-screen');
    });

    function startMap(mapName) {
      currentMap = maps[mapName];
      showScreen('game-screen');
      initGame();
      if (animationId) cancelAnimationFrame(animationId);
      animate();
    }

    document.getElementById('map-egypt').addEventListener('click', () => startMap('Egypt'));
    document.getElementById('map-australia').addEventListener('click', () => startMap('Australia'));
    document.getElementById('map-africa').addEventListener('click', () => startMap('Africa'));
    document.getElementById('map-back-btn').addEventListener('click', () => showScreen('home-screen'));

    document.getElementById('customize-btn').addEventListener('click', () => {
      showScreen('custom-screen');
      createEditor('p1-grid', 'p1-palette', 'p1-rgb', p1Sprite, () => p1SelectedColor, (c) => p1SelectedColor = c);
      createEditor('p2-grid', 'p2-palette', 'p2-rgb', p2Sprite, () => p2SelectedColor, (c) => p2SelectedColor = c);
    });

    document.getElementById('back-btn').addEventListener('click', () => showScreen('home-screen'));
    document.getElementById('rematch-btn').addEventListener('click', () => initGame());
    document.getElementById('menu-btn').addEventListener('click', () => {
      if (animationId) cancelAnimationFrame(animationId);
      showScreen('home-screen');
    });
  </script>
</body>
</html>
