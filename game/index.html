<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dodge the Blocks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: #000000;
            color: #fff;
        }

        #gameCanvas {
            position: relative;
            width: 400px;
            height: 500px;
            background-color: #000000;
            margin: 0 auto;
            overflow: hidden;
            border: 2px solid #555;
        }

        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #2ecc71;
            border-radius: 5px;
        }

        #enemy {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #e74c3c;
            border-radius: 50%;
        }

        #scoreBoard {
            font-size: 1.5rem;
            margin-top: 15px;
        }
        
        button {
            font-family: 'Inter', sans-serif;
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>Dodge the Blocks</h1>
    <div id="gameCanvas">
        <div id="player"></div>
        <div id="enemy"></div>
    </div>
    <p id="scoreBoard">Score: 0</p>

    <button type="button" onclick="resetGame()">Retry</button>

    <script>
        const playerElem = document.getElementById("player");
        const enemyElem = document.getElementById("enemy");
        const scoreDisplay = document.getElementById("scoreBoard");

        let score = 0;
        let enemySpeed = 4;
        let gameLoopId;

        const player = { x: 180, y: 440, width: 40, height: 40 };
        const enemy = { x: 180, y: 0, width: 30, height: 30 };

        let keysPressed = {};

        document.addEventListener("keydown", function (event) {
          keysPressed[event.key] = true;
        });

        document.addEventListener("keyup", function (event) {
          keysPressed[event.key] = false;
        });

        function randomBetween(min, max) {
          return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function isColliding(a, b) {
          return (
            a.x < b.x + b.width &&
            a.x + a.width > b.x &&
            a.y < b.y + b.height &&
            a.y + a.height > b.y
          );
        }

        function resetEnemy() {
          enemy.y = -30;
          enemy.x = randomBetween(0, 370);
          enemyElem.style.left = enemy.x + "px";
        }

        function updateGame() {
          if (keysPressed["ArrowLeft"] && player.x > 0) player.x -= 6;
          if (keysPressed["ArrowRight"] && player.x < 360) player.x += 6;

          enemy.y += enemySpeed;

          if (enemy.y > 500) {
            score += 1;
            scoreDisplay.textContent = "Score: " + score;
            resetEnemy();
            
            if (score % 5 === 0) {
              enemySpeed += 1;
            }
          }

          playerElem.style.left = player.x + "px";
          playerElem.style.top = player.y + "px";
          enemyElem.style.top = enemy.y + "px";

          if (isColliding(player, enemy)) {
            clearInterval(gameLoopId);
            scoreDisplay.textContent = "GAME OVER! Final Score: " + score;
            playerElem.style.backgroundColor = "gray";
          }
        }

        function startGameLoop() {
            clearInterval(gameLoopId);
            gameLoopId = setInterval(updateGame, 20);
        }

        function resetGame() {
            score = 0;
            enemySpeed = 4;
            scoreDisplay.textContent = "Score: " + score;
            playerElem.style.backgroundColor = "#2ecc71";

            player.x = 180;
            player.y = 440;
            playerElem.style.left = player.x + "px";
            playerElem.style.top = player.y + "px";

            resetEnemy();

            startGameLoop();
        }

        resetGame();
    </script>
</body>
</html>
