<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biscuit Clicker</title>
    <style>
        :root {
            --primary-color: #d97706;
            --secondary-color: #92400e;
            --bg-color: #fffbeb;
            --card-bg: #ffffff;
            --text-color: #78350f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Layout */
        .game-container {
            display: flex;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        .clicker-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 2px dashed #fde68a;
            padding: 20px;
            user-select: none;
            position: relative;
        }

        .shop-section {
            width: 380px;
            background-color: var(--card-bg);
            padding: 20px;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* Scoreboard */
        .score-board {
            text-align: center;
            margin-bottom: 30px;
            z-index: 5;
        }

        .score-board h1 {
            font-size: 2.5rem;
            color: var(--secondary-color);
            margin-bottom: 5px;
        }

        .score-board p {
            font-size: 1.1rem;
            opacity: 0.8;
        }

        /* Biscuit Wrapper & Ring for Cursors */
        .biscuit-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cursor-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 50%;
        }

        /* Orbiting Cursor Animation */
        .orbit-cursor {
            position: absolute;
            width: 24px;
            height: 24px;
            top: 50%;
            left: 50%;
            margin-top: -12px;
            margin-left: -12px;
            pointer-events: none;
            transition: transform 0.2s ease-out;
        }

        .cursor-icon {
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2378350f"><path d="M4.5 2.5L18.5 12L12.5 13.5L16.5 21.5L13.5 23L9.5 15L4.5 19.5V2.5Z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            animation: clickPulse 1.2s infinite ease-in-out;
        }

        @keyframes clickPulse {
            0%, 100% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(0.85) translate(-4px, -4px); }
        }

        /* Biscuit Styling */
        .biscuit {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, #f59e0b 0%, #d97706 70%, #b45309 100%);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(180, 83, 9, 0.3), inset 0 -8px 0 rgba(0, 0, 0, 0.15);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.05s ease;
            z-index: 5;
        }

        .biscuit:active {
            transform: scale(0.95);
        }

        /* Biscuit details (drops/holes) */
        .biscuit-detail {
            position: absolute;
            width: 15px;
            height: 15px;
            background-color: #b45309;
            border-radius: 50%;
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.3);
        }

        .d1 { top: 40px; left: 60px; }
        .d2 { top: 40px; right: 60px; }
        .d3 { bottom: 50px; left: 90px; }
        .d4 { top: 100px; left: 45px; }
        .d5 { top: 100px; right: 45px; }

        /* Shop Styling */
        .shop-section h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
            color: var(--secondary-color);
        }

        .upgrade-list {
            overflow-y: auto;
            flex: 1;
        }

        .upgrade-item {
            background-color: var(--bg-color);
            border: 1px solid #fde68a;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upgrade-item:hover:not(.disabled) {
            background-color: #fef3c7;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .upgrade-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .upgrade-info h3 {
            font-size: 1rem;
            color: var(--secondary-color);
        }

        .upgrade-info p {
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .upgrade-cost {
            font-weight: bold;
            color: var(--primary-color);
            background: #fff;
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid #fde68a;
            font-size: 0.9rem;
        }

        /* Floating text animation */
        .floating-text {
            position: absolute;
            font-weight: bold;
            color: var(--secondary-color);
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            z-index: 20;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
        }

        /* Floating Background Cookies */
        .bg-cookie {
            position: fixed;
            width: 35px;
            height: 35px;
            background: radial-gradient(circle, #f59e0b 0%, #d97706 70%, #b45309 100%);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.6;
            z-index: 1;
            animation: floatBgCookie linear forwards;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2);
        }

        @keyframes floatBgCookie {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.6);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Clicker Section -->
        <div class="clicker-section">
            <div class="score-board">
                <h1 id="score">0</h1>
                <p>Biscuits baked</p>
                <p id="cps" style="font-size: 0.9rem; margin-top: 5px;">per second: 0</p>
            </div>

            <div class="biscuit-container">
                <div class="cursor-ring" id="cursorRing"></div>
                <div class="biscuit" id="biscuit">
                    <div class="biscuit-detail d1"></div>
                    <div class="biscuit-detail d2"></div>
                    <div class="biscuit-detail d3"></div>
                    <div class="biscuit-detail d4"></div>
                    <div class="biscuit-detail d5"></div>
                </div>
            </div>
        </div>

        <!-- Shop Section -->
        <div class="shop-section">
            <h2>Bakery Shop</h2>
            <div class="upgrade-list" id="upgradeList">
                <!-- Upgrades injected via JS -->
            </div>
        </div>
    </div>

    <script>
        // Game State
        let score = 0;
        let cps = 0;

        const upgrades = [
            { id: 'cursor', name: 'Auto-Roller', cost: 15, cps: 0.5, owned: 0, desc: 'Rolls biscuits automatically.' },
            { id: 'grandma', name: 'GrandmaBaker', cost: 100, cps: 4, owned: 0, desc: 'Bakes with grandma\'s secret touch.' },
            { id: 'oven', name: 'Brick Oven', cost: 1100, cps: 32, owned: 0, desc: 'A blazing hot biscuit oven.' },
            { id: 'factory', name: 'Biscuit Factory', cost: 13000, cps: 260, owned: 0, desc: 'Mass production line.' }
        ];

        const scoreEl = document.getElementById('score');
        const cpsEl = document.getElementById('cps');
        const biscuitEl = document.getElementById('biscuit');
        const upgradeListEl = document.getElementById('upgradeList');
        const cursorRingEl = document.getElementById('cursorRing');

        // Render Shop Items
        function renderShop() {
            upgradeListEl.innerHTML = '';
            upgrades.forEach(upg => {
                const item = document.createElement('div');
                item.className = `upgrade-item ${score < upg.cost ? 'disabled' : ''}`;
                item.onclick = () => buyUpgrade(upg.id);

                item.innerHTML = `
                    <div class="upgrade-info">
                        <h3>${upg.name} (${upg.owned})</h3>
                        <p>${upg.desc}</p>
                    </div>
                    <div class="upgrade-cost">${Math.floor(upg.cost)}</div>
                `;
                upgradeListEl.appendChild(item);
            });
        }

        // Update Orbiting Cursors visual positioning around the biscuit
        function updateCursors() {
            const cursorUpgrade = upgrades.find(u => u.id === 'cursor');
            const count = cursorUpgrade ? cursorUpgrade.owned : 0;
            cursorRingEl.innerHTML = '';

            const radius = 135; // Distance from biscuit center in pixels
            for (let i = 0; i < count; i++) {
                const angle = (i / count) * (2 * Math.PI);
                const x = Math.cos(angle) * radius;
                const y = Math.sin(angle) * radius;
                const rotationDeg = (angle * (180 / Math.PI)) + 90;

                const cursorEl = document.createElement('div');
                cursorEl.className = 'orbit-cursor';
                cursorEl.style.transform = `translate(${x}px, ${y}px) rotate(${rotationDeg}deg)`;

                const icon = document.createElement('div');
                icon.className = 'cursor-icon';
                icon.style.animationDelay = `${(i % 5) * 0.15}s`;

                cursorEl.appendChild(icon);
                cursorRingEl.appendChild(cursorEl);
            }
        }

        // Spawn a background floating cookie particle
        function spawnBgCookie(startX) {
            const cookie = document.createElement('div');
            cookie.className = 'bg-cookie';

            // Random horizontal positioning near click point
            const offset = (Math.random() - 0.5) * 100;
            const leftPos = Math.max(10, Math.min(window.innerWidth - 40, startX + offset));

            cookie.style.left = `${leftPos}px`;
            cookie.style.bottom = `-40px`;

            const duration = 2.5 + Math.random() * 2;
            cookie.style.animationDuration = `${duration}s`;

            document.body.appendChild(cookie);
            setTimeout(() => cookie.remove(), duration * 1000);
        }

        // Click Biscuit Event
        biscuitEl.addEventListener('click', (e) => {
            score += 1;
            updateDisplay();

            // Floating click number effect
            const rect = biscuitEl.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const floatText = document.createElement('div');
            floatText.className = 'floating-text';
            floatText.innerText = '+1';
            floatText.style.left = `${x}px`;
            floatText.style.top = `${y}px`;
            biscuitEl.appendChild(floatText);

            setTimeout(() => floatText.remove(), 600);

            // Trigger background floating cookie
            spawnBgCookie(e.clientX);
        });

        // Buy Upgrade Function
        function buyUpgrade(id) {
            const upg = upgrades.find(u => u.id === id);
            if (score >= upg.cost) {
                score -= upg.cost;
                upg.owned += 1;
                cps += upg.cps;
                upg.cost *= 1.15; // Standard incremental cost scaling
                updateDisplay();
                if (id === 'cursor') {
                    updateCursors();
                }
            }
        }

        // Update Text and UI
        function updateDisplay() {
            scoreEl.innerText = Math.floor(score);
            cpsEl.innerText = `per second: ${cps.toFixed(1)}`;
            renderShop();
        }

        // Game Loop (per second)
        setInterval(() => {
            if (cps > 0) {
                score += cps / 10;
                updateDisplay();
            }
        }, 100);

        // Initial setup
        renderShop();
        updateCursors();
    </script>
</body>
</html>
