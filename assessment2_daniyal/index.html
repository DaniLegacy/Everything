<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors - Deluxe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Rock Paper Scissors</h1>

        <div class="score-board">
            <p>Player: <span id="playerScore">0</span></p>
            <p>Bot: <span id="compScore">0</span></p>
        </div>

        <div class="choices">
            <button class="btn choice-btn" value="Rock">Rock</button>
            <button class="btn choice-btn" value="Paper">Paper</button>
            <button class="btn choice-btn" value="Scissors">Scissors</button>
        </div>

        <div id="result">First to 5 points wins. Please pick your move.</div>

        <button id="resetBtn">Reset Game</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
