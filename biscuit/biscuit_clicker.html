<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biscuit Clicker</title>
    <style>
        #cookieButton img {
            transition: transform 0.1s ease;
        }
        #cookieButton img:hover {
            transform: scale(1.05);
        }
        #cookieButton img:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>Biscuit Clicker</h1>
    <p>Biscuits Clicked: <span id="biscuitCount">0</span></p>
    
    <button id="cookieButton" style="background: none; border: none; cursor: pointer;">
        <img src="biscuit.png" alt="Biscuit" width="200" height="200">
    </button>

    <!-- Put this right below your main cookieButton -->
    <hr>
    <h3>Upgrades</h3>
    <button id="bakerButton">Hire a Baker (Cost: 15 Biscuits)</button>
    <p>Bakers: <span id="bakerCount">0</span></p>


    <script src="biscuit_clicker.js"></script>

</body>
</html>
